# The office-runner Windows installer on a real Windows machine: paste the portal's one-liner into Windows PowerShell 5.1
# and into PowerShell 7, check the install, install again over the running copy, uninstall.
# A throwaway local portal only (127.0.0.1, fresh data file, generated password, no LinkedIn accounts): nothing here talks
# to the live server or to LinkedIn.
name: office-runner-windows

on:
  push:
    branches: [ci/windows-runner]
    paths:
      - deploy/office-runner/**
      - app/linkedin_runner*.py
      - app/routes_linkedin_runner.py
      - tools/linkedin_runner.mjs
      - tools/linkedin_agent_pool.mjs
      - deploy/linkedin-runtime/**
      - scripts/ci/office_runner_windows.ps1
      - .github/workflows/office-runner-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.shell }}${{ matrix.node == 'none' && ', no Node.js' || '' }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
        node: [preinstalled]
        include:
          - shell: powershell
            node: none
    env:
      OUTREACH_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '24'          # what the first real office PC had (Node 24.19); the no-Node leg gets the installer's own Node 20

      - name: Install the API's Python packages
        run: python -m pip install -r requirements.txt

      - name: Install, re-install and uninstall the office runner (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\ci\office_runner_windows.ps1" -Shell powershell -HideNode:$('${{ matrix.node }}' -eq 'none')
          exit $LASTEXITCODE

      - name: Install, re-install and uninstall the office runner (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\ci\office_runner_windows.ps1" -Shell pwsh
          exit $LASTEXITCODE

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-runner-logs-${{ matrix.shell }}-${{ matrix.node }}
          path: ${{ runner.temp }}/office-runner-logs
          if-no-files-found: warn
