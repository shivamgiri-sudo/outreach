<!DOCTYPE html>
<!-- Fictional company. A careers page whose only structured data is the Yoast site graph: no JobPosting at all
     (openings are rendered by JavaScript), so the importer must say "no job listings found". -->
<html>
<head>
<script type="application/ld+json" class="yoast-schema-graph">{"@context":"https://schema.org","@graph":[{"@type":"CollectionPage","@id":"https://deccan-pharma.example/careers/","url":"https://deccan-pharma.example/careers/","name":"Careers","inLanguage":"en-IN"},{"@type":"Organization","@id":"https://deccan-pharma.example/#organization","name":"Deccan Pharma","url":"https://deccan-pharma.example/","sameAs":["https://www.facebook.com/deccanpharma.example","https://www.linkedin.com/company/deccan-pharma-example"]}]}</script>
</head>
<body><div id="openings" data-src="/api/openings.json"></div></body>
</html>
